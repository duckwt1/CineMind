services:
  # ============================================================================
  # PostgreSQL 16 with pgvector Extension
  # Authoritative relational and vector database for CineMind
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cinemind-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-cinemind}
      POSTGRES_USER: ${DB_USER:-cinemind_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cinemind_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cinemind_user} -d ${DB_NAME:-cinemind}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cinemind-network

  # ============================================================================
  # CineMind Backend API Server (Java 21 / Spring Boot 3.3)
  # Automatically starts with Postgres, runs migrations & exposes REST APIs
  # ============================================================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cinemind-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-cinemind}
      DB_USER: ${DB_USER:-cinemind_user}
      DB_PASSWORD: ${DB_PASSWORD:-cinemind_password}
      JWT_SECRET: ${JWT_SECRET:-cinemind_super_secret_jwt_key_must_be_at_least_256_bits_long_for_hmac_sha256!}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cinemind-network

volumes:
  postgres_data:
    driver: local

networks:
  cinemind-network:
    driver: bridge
